<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Tab</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <div id="backdrop" aria-hidden="true"></div>
    <img id="painting" alt="" />

    <figure id="info" hidden>
      <figcaption>
        <span id="museum"></span>
        <a id="title" target="_blank" rel="noopener"></a>
        <span id="artist"></span>
        <span id="date"></span>
        <small id="copyright"></small>
      </figcaption>
    </figure>

    <nav id="controls" aria-label="Paintings" hidden>
      <button id="previous" class="control" type="button" title="Previous painting (←)" aria-label="Previous painting" disabled>←</button>
      <!-- Shows ↻ on the newest painting and → after going back; newtab.js switches them. -->
      <button id="shuffle" class="control" type="button" title="Show another painting (Space or →)" aria-label="Show another painting">
        <span class="icon icon-new" aria-hidden="true">↻</span>
        <span class="icon icon-forward" aria-hidden="true">→</span>
      </button>
    </nav>

    <p id="status" role="status"></p>

    <script src="newtab.js" type="module"></script>
  </body>
</html>
